{% extends "base.html" %}
{% block content %}
{% load django_bootstrap5 %}
<form method="post" class="col-lg-6 offset-lg-3">
  <div class="row justify-content-center">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>
{% endblock content %}
